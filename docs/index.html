<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sp500-screener</title>
<meta name="description" content="Daily paper-trading ladder over the S&amp;P 500 — factor scores, open positions, and performance.">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!-- TradingView's own charting library (Lightweight Charts, Apache-2.0, ~45KB).
     Pinned to an exact version so a future major release can't silently change
     the API out from under this page. If it fails to load for any reason, the
     chart code falls back to the hand-built SVG renderer further down. -->
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root {
    --bg: #0d1114;
    --panel: #12171b;
    --panel-2: #171d22;
    --ink: #e8e6e0;
    --muted: #838b93;
    --faint: #4c545c;
    --accent: #d4a24c;
    --gain: #5fae84;
    --loss: #c2645c;
    --line: rgba(232, 230, 224, 0.09);
    --sans: "IBM Plex Sans", -apple-system, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  body { padding: 0 0 6rem; }

  a { color: var(--accent); }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  .wrap {
    max-width: 860px;
    margin: 0 auto;
    padding: 0 1.25rem;
  }

  /* ---- top bar ---------------------------------------------------- */
  header.top {
    border-bottom: 1px solid var(--line);
    padding: 1.4rem 0;
  }
  header.top .wrap { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  header.top h1 { font-size: 1.05rem; font-weight: 600; margin: 0; letter-spacing: 0.01em; }
  header.top .strategy { color: var(--muted); font-family: var(--mono); font-size: 0.85rem; }

  /* ---- hero -------------------------------------------------------- */
  .hero {
    padding: 2.4rem 0 1.6rem;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: end;
    gap: 1.5rem;
  }
  .hero .label { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.35rem; }
  .hero .equity { font-family: var(--mono); font-size: clamp(2.2rem, 7vw, 3.4rem); font-weight: 500; line-height: 1; }
  .hero .delta { margin-top: 0.5rem; font-family: var(--mono); font-size: 1rem; }
  .hero .bench { color: var(--muted); font-size: 0.85rem; margin-top: 0.25rem; }
  .hero svg.spark { display: block; width: 220px; height: 64px; }
  @media (max-width: 560px) {
    .hero { grid-template-columns: 1fr; }
    .hero svg.spark { width: 100%; height: 56px; }
  }

  .gain { color: var(--gain); }
  .loss { color: var(--loss); }
  .accent { color: var(--accent); }

  /* ---- stat strip ---------------------------------------------------- */
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .stat { padding: 0.9rem 0.2rem; border-left: 1px solid var(--line); }
  .stat:first-child { border-left: none; }
  .stat .k { color: var(--muted); font-size: 0.72rem; margin-bottom: 0.3rem; }
  .stat .v { font-family: var(--mono); font-size: 1.05rem; }

  /* ---- sections ------------------------------------------------------- */
  section { padding: 2.2rem 0; border-bottom: 1px solid var(--line); }
  section:last-of-type { border-bottom: none; }
  section h2 { font-size: 0.95rem; font-weight: 600; margin: 0 0 1rem; }
  section .sub { color: var(--muted); font-size: 0.82rem; margin: -0.6rem 0 1.1rem; }
  section.empty p { color: var(--muted); font-size: 0.88rem; }

  .chart-wrap {
    background: linear-gradient(180deg, #10161b 0%, #0f1418 100%);
    border: 1px solid var(--line);
    padding: 0;
    overflow: hidden;
  }
  .chart-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.85rem 0.95rem;
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }
  .chart-periods { display: flex; gap: 0.2rem; }
  .chart-period {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--muted);
    font: 500 0.76rem var(--mono);
    padding: 0.35rem 0.55rem;
    border-radius: 4px;
    cursor: pointer;
  }
  .chart-period:hover { color: var(--ink); background: var(--panel-2); }
  .chart-period.active { color: var(--ink); background: var(--panel-2); }
  .chart-range { color: var(--muted); font: 0.75rem var(--mono); }
  .tv-chart { position: relative; min-height: 310px; }
  .tv-readout {
    position: absolute; top: 10px; left: 12px; z-index: 3;
    display: flex; flex-direction: column; gap: 0.15rem;
    font: 0.72rem/1.45 var(--mono); pointer-events: none;
  }
  .tv-readout .d { color: var(--muted); }
  .tv-readout .p { color: var(--accent); }
  .tv-readout .b { color: #68727d; }
  svg.chart { display: block; width: 100%; height: 310px; }
  .chart-tooltip {
    position: absolute;
    display: none;
    min-width: 170px;
    padding: 0.6rem 0.7rem;
    pointer-events: none;
    background: #151c22;
    border: 1px solid rgba(212, 162, 76, 0.35);
    box-shadow: 0 12px 32px rgba(0,0,0,.35);
    border-radius: 5px;
    z-index: 3;
    font-family: var(--mono);
    font-size: 0.72rem;
  }
  .chart-tooltip .date { color: var(--muted); margin-bottom: 0.35rem; }
  .chart-tooltip .row { display: flex; justify-content: space-between; gap: 1rem; line-height: 1.55; }
  .chart-tooltip .portfolio { color: var(--accent); }
  .chart-tooltip .benchmark { color: #7f8992; }
  .chart-legend {
    display: flex;
    gap: 1.3rem;
    padding: 0.65rem 0.95rem 0.8rem;
    font-size: 0.8rem;
    color: var(--muted);
    border-top: 1px solid var(--line);
  }
  .chart-legend span.sw { display: inline-block; width: 18px; height: 2px; margin-right: 0.4rem; vertical-align: middle; }

  /* ---- tables ----------------------------------------------------------- */
  .tbl-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
  th, td { text-align: left; padding: 0.5rem 0.7rem; white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: 0.75rem; border-bottom: 1px solid var(--line); }
  td { border-bottom: 1px solid var(--line); font-family: var(--mono); }
  td.name-cell { font-family: var(--sans); }
  tbody tr:hover td { background: var(--panel); }
  td.num, th.num { text-align: right; }
  .ticker-badge {
    background: var(--panel-2);
    color: var(--accent);
    border-radius: 4px;
    padding: 0.1rem 0.4rem;
    font-weight: 500;
  }

  /* ---- sector bars -------------------------------------------------------- */
  .sector-row { display: grid; grid-template-columns: 150px 1fr 3.2rem; align-items: center; gap: 0.7rem; padding: 0.4rem 0; font-size: 0.85rem; }
  .sector-row .name { color: var(--ink); }
  .sector-track { position: relative; height: 8px; background: var(--panel); }
  .sector-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }
  .sector-cap-mark { position: absolute; top: -2px; bottom: -2px; width: 1px; background: var(--muted); }
  .sector-row .count { text-align: right; color: var(--muted); font-family: var(--mono); }

  /* ---- factor weight bars -------------------------------------------------- */
  .weight-row { display: grid; grid-template-columns: 110px 1fr 3.6rem; align-items: center; gap: 0.7rem; padding: 0.35rem 0; font-size: 0.85rem; }
  .weight-track { height: 8px; background: var(--panel); }
  .weight-fill { height: 100%; background: var(--accent); }
  .weight-row .pct { text-align: right; font-family: var(--mono); color: var(--muted); }

  footer { padding: 2.4rem 0 0; color: var(--faint); font-size: 0.78rem; line-height: 1.6; }

  .state-msg { padding: 4rem 0; text-align: center; color: var(--muted); }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <h1>sp500-screener</h1>
    <span class="strategy" id="strategyLabel">loading —</span>
  </div>
</header>

<div class="wrap" id="app">
  <div class="state-msg" id="stateMsg">Loading the latest run…</div>
</div>

<script>
const $ = (sel, el = document) => el.querySelector(sel);
const app = $('#app');

const fmtUSD = (v) => v == null ? '—' :
  '$' + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtPct = (v, digits = 2) => v == null ? '—' :
  (v >= 0 ? '+' : '') + (v * 100).toFixed(digits) + '%';
const pctClass = (v) => v == null ? '' : (v > 0 ? 'gain' : v < 0 ? 'loss' : '');
const fmtNum = (v, digits = 2) => v == null ? '—' : Number(v).toFixed(digits);
const fmtDate = (s) => {
  if (!s) return '—';
  const d = new Date(s + (s.length === 10 ? 'T00:00:00Z' : ''));
  if (isNaN(d)) return s;
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
};
const el = (tag, attrs = {}, children = []) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') e.textContent = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k === 'class') e.className = v;
    else e.setAttribute(k, v);
  }
  (Array.isArray(children) ? children : [children]).forEach(c => c && e.appendChild(c));
  return e;
};

/* ---- tiny dependency-free SVG line chart -------------------------------- */
function lineChart(series, { width = 760, height = 220, pad = 6 } = {}) {
  const all = series.flatMap(s => s.values.filter(v => v != null));
  if (!all.length) return el('div', { text: 'not enough data yet' });
  const min = Math.min(...all), max = Math.max(...all);
  const span = (max - min) || 1;
  const n = Math.max(...series.map(s => s.values.length));
  const x = i => pad + (i / Math.max(1, n - 1)) * (width - 2 * pad);
  const y = v => height - pad - ((v - min) / span) * (height - 2 * pad);

  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
  svg.setAttribute('class', 'chart');
  svg.setAttribute('preserveAspectRatio', 'none');

  series.forEach(s => {
    const pts = s.values.map((v, i) => v == null ? null : `${x(i)},${y(v)}`).filter(Boolean);
    if (pts.length < 2) return;
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
    path.setAttribute('points', pts.join(' '));
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', s.color);
    path.setAttribute('stroke-width', s.width || 1.6);
    path.setAttribute('stroke-linecap', 'round');
    path.setAttribute('stroke-linejoin', 'round');
    const len = pts.length * 40;
    path.style.strokeDasharray = len;
    path.style.strokeDashoffset = len;
    path.style.transition = 'stroke-dashoffset 900ms ease-out';
    svg.appendChild(path);
    requestAnimationFrame(() => requestAnimationFrame(() => { path.style.strokeDashoffset = 0; }));
  });
  return svg;
}

/* ---- sections ------------------------------------------------------------- */
function renderHero(d) {
  const stats = d.stats || {};
  const eq = (d.equity_curve || []).map(r => r.equity);
  const bench = (d.equity_curve || []).map(r => r.benchmark_equity);

  const hero = el('div', { class: 'hero' });
  const left = el('div');
  left.append(
    el('div', { class: 'label', text: 'Portfolio equity' }),
    el('div', { class: 'equity num', text: fmtUSD(d.portfolio ? d.portfolio.equity : null) }),
    el('div', { class: `delta num ${pctClass(stats.total_return)}`, text: fmtPct(stats.total_return) + ' since inception' }),
    el('div', {
      class: 'bench',
      text: stats.benchmark_return != null
        ? `S&P 500 (SPY) over the same span: ${fmtPct(stats.benchmark_return)}`
        : 'Benchmark not available yet'
    }),
  );
  hero.appendChild(left);
  if (eq.filter(v => v != null).length > 1) {
    hero.appendChild(lineChart(
      [{ values: eq, color: 'var(--accent)'.includes('var') ? '#d4a24c' : '#d4a24c', width: 1.8 }],
      { width: 220, height: 64, pad: 3 }
    ));
    $('svg', hero).classList.add('spark');
  }
  return hero;
}

function renderStats(d) {
  const s = d.stats || {};
  const cells = [
    ['Sharpe', fmtNum(s.sharpe, 2)],
    ['CAGR', s.cagr != null ? fmtPct(s.cagr, 1) : '—'],
    ['Max drawdown', s.max_drawdown != null ? fmtPct(s.max_drawdown, 1) : '—'],
    ['Win rate', s.win_rate != null ? fmtPct(s.win_rate, 0) : '—'],
    ['Closed trades', s.n_trades ?? '—'],
    ['Avg hold (days)', fmtNum(s.avg_hold, 1)],
    ['Days live', s.days_live ?? '—'],
  ];
  const wrap = el('div', { class: 'stats' });
  cells.forEach(([k, v]) => wrap.appendChild(el('div', { class: 'stat' }, [
    el('div', { class: 'k', text: k }),
    el('div', { class: 'v', text: String(v) }),
  ])));
  return wrap;
}

function renderEquitySection(d) {
  const rows = d.equity_curve || [];
  const sec = el('section');
  sec.appendChild(el('h2', { text: 'Portfolio performance' }));

  if (rows.length < 2) {
    sec.classList.add('empty');
    sec.appendChild(el('p', { text: 'Not enough history yet — check back after a few daily runs.' }));
    return sec;
  }

  const chartWrap = el('div', { class: 'chart-wrap' });
  const toolbar = el('div', { class: 'chart-toolbar' });
  const periods = el('div', { class: 'chart-periods' });
  const rangeLabel = el('div', { class: 'chart-range num' });
  toolbar.append(periods, rangeLabel);

  const chartBox = el('div', { class: 'tv-chart' });
  const legend = el('div', { class: 'chart-legend' });
  legend.append(
    el('span', { html: '<span class="sw" style="background:#d4a24c"></span>Portfolio' }),
    el('span', { html: '<span class="sw" style="background:#68727d"></span>S&amp;P 500 (SPY)' })
  );

  chartWrap.append(toolbar, chartBox, legend);
  sec.appendChild(chartWrap);

  const periodDefs = [
    { id: '1W', label: '1W', days: 7 },
    { id: '1M', label: '1M', days: 31 },
    { id: '3M', label: '3M', days: 93 },
    { id: 'ALL', label: 'All', days: null },
  ];
  const lastDate = new Date(rows[rows.length - 1].date + 'T00:00:00Z');

  function render(periodId) {
    periods.innerHTML = '';
    periodDefs.forEach(function(p) {
      const btn = el('button', {
        class: 'chart-period' + (p.id === periodId ? ' active' : ''),
        text: p.label,
        type: 'button'
      });
      btn.addEventListener('click', function() { render(p.id); });
      periods.appendChild(btn);
    });

    let visible = rows;
    if (periodId !== 'ALL') {
      const days = periodDefs.find(function(p) { return p.id === periodId; }).days;
      const cutoff = new Date(lastDate.getTime() - (days - 1) * 86400000);
      visible = rows.filter(function(r) {
        return new Date(r.date + 'T00:00:00Z') >= cutoff;
      });
      if (visible.length < 2) visible = rows.slice(-2);
    }

    rangeLabel.textContent = fmtDate(visible[0].date) + ' — ' + fmtDate(visible[visible.length - 1].date);

    const baseEquity = visible[0].equity || 1;
    let baseBenchmark = null;
    for (const r of visible) {
      if (r.benchmark_equity != null) { baseBenchmark = r.benchmark_equity; break; }
    }

    const portfolioValues = visible.map(function(r) {
      return r.equity == null ? null : (r.equity / baseEquity - 1) * 100;
    });
    const benchmarkValues = visible.map(function(r) {
      return (baseBenchmark == null || r.benchmark_equity == null)
        ? null
        : (r.benchmark_equity / baseBenchmark - 1) * 100;
    });

    const labels = visible.map(function(r) { return r.date; });

    // The chart library measures its container, so it can only be built once
    // the section is actually in the document. On the very first render this
    // function runs while `sec` is still detached, hence the rAF defer; on a
    // period click the element is already live and rAF just costs one frame.
    requestAnimationFrame(function() {
      chartBox.innerHTML = '';
      if (!tvChart(chartBox, labels, portfolioValues, benchmarkValues)) {
        chartBox.appendChild(interactiveEquityChart(
          portfolioValues, benchmarkValues, labels, 800, 310
        ));
      }
    });
  }

  render('ALL');
  return sec;
}

/* ---- TradingView Lightweight Charts renderer ----------------------------
   Returns true if it drew; false if the library isn't available, in which
   case the caller falls back to the hand-built SVG chart below. Both series
   are plotted as percent change from the first bar of the visible window, so
   the portfolio and SPY are directly comparable regardless of their dollar
   levels. */
function tvChart(host, labels, portfolio, benchmark) {
  const LWC = window.LightweightCharts;
  if (!LWC || typeof LWC.createChart !== 'function') return false;

  const css = getComputedStyle(document.documentElement);
  const v = (name, fallback) => (css.getPropertyValue(name) || '').trim() || fallback;
  const ink = v('--ink', '#e8e6e0');
  const muted = v('--muted', '#838b93');
  const gold = v('--accent', '#d4a24c');
  const grid = 'rgba(232, 230, 224, 0.06)';
  const grey = '#68727d';

  let chart;
  try {
    chart = LWC.createChart(host, {
      width: host.clientWidth || 800,
      height: 310,
      layout: {
        background: { type: 'solid', color: 'transparent' },
        textColor: muted,
        fontFamily: 'IBM Plex Mono, ui-monospace, monospace',
        fontSize: 11,
      },
      grid: { vertLines: { color: grid }, horzLines: { color: grid } },
      rightPriceScale: { borderColor: grid, scaleMargins: { top: 0.12, bottom: 0.12 } },
      timeScale: { borderColor: grid, fixLeftEdge: true, fixRightEdge: true },
      crosshair: {
        mode: LWC.CrosshairMode ? LWC.CrosshairMode.Magnet : 1,
        vertLine: { color: muted, width: 1, style: 3, labelBackgroundColor: '#171d22' },
        horzLine: { color: muted, width: 1, style: 3, labelBackgroundColor: '#171d22' },
      },
      handleScale: false,      // the period buttons are the zoom control here;
      handleScroll: false,     // free panning would just desync the range label
      localization: {
        priceFormatter: (p) => (p >= 0 ? '+' : '') + p.toFixed(2) + '%',
      },
    });
  } catch (err) {
    return false;
  }

  const toSeries = (values) => {
    const out = [];
    for (let i = 0; i < labels.length; i++) {
      if (values[i] == null || !isFinite(values[i])) continue;
      out.push({ time: labels[i], value: values[i] });
    }
    return out;
  };

  const spyData = toSeries(benchmark);
  let spySeries = null;
  if (spyData.length > 1) {
    spySeries = chart.addLineSeries({
      color: grey, lineWidth: 1, priceLineVisible: false, lastValueVisible: false,
    });
    spySeries.setData(spyData);
  }

  const portSeries = chart.addAreaSeries({
    lineColor: gold,
    lineWidth: 2,
    topColor: 'rgba(212, 162, 76, 0.22)',
    bottomColor: 'rgba(212, 162, 76, 0.01)',
    priceLineVisible: false,
    lastValueVisible: true,
  });
  portSeries.setData(toSeries(portfolio));
  chart.timeScale().fitContent();

  // Floating readout, TradingView-style: sits over the top-left of the plot
  // and tracks the crosshair, showing the last bar when the pointer is away.
  const readout = el('div', { class: 'tv-readout' });
  host.appendChild(readout);
  const pct = (x) => (x == null ? '—' : (x >= 0 ? '+' : '') + x.toFixed(2) + '%');
  const paint = (date, p, b) => {
    readout.innerHTML =
      '<span class="d">' + (date ? fmtDate(date) : '') + '</span>' +
      '<span class="p">Portfolio ' + pct(p) + '</span>' +
      '<span class="b">SPY ' + pct(b) + '</span>';
  };
  const lastIdx = portfolio.length - 1;
  paint(labels[lastIdx], portfolio[lastIdx], benchmark[lastIdx]);

  chart.subscribeCrosshairMove(function(param) {
    if (!param || !param.time || !param.seriesData) {
      paint(labels[lastIdx], portfolio[lastIdx], benchmark[lastIdx]);
      return;
    }
    const p = param.seriesData.get(portSeries);
    const b = spySeries ? param.seriesData.get(spySeries) : null;
    paint(param.time, p ? p.value : null, b ? b.value : null);
  });

  if (typeof ResizeObserver === 'function') {
    const ro = new ResizeObserver(function() {
      if (host.clientWidth) chart.applyOptions({ width: host.clientWidth });
    });
    ro.observe(host);
  }
  return true;
}

function interactiveEquityChart(portfolio, benchmark, dates, width, height) {
  const values = portfolio.concat(benchmark).filter(function(v) { return v != null; });
  if (values.length < 2) return el('div', { text: 'Not enough data yet.' });

  const pad = { left: 54, right: 18, top: 18, bottom: 28 };
  const plotW = width - pad.left - pad.right;
  const plotH = height - pad.top - pad.bottom;
  let min = Math.min.apply(null, values);
  let max = Math.max.apply(null, values);
  const range = Math.max(max - min, 1);
  const step = Math.max(1, Math.ceil(range / 5));
  min = Math.floor((min - step * 0.35) / step) * step;
  max = Math.ceil((max + step * 0.35) / step) * step;

  const x = function(i) { return pad.left + (i / Math.max(1, dates.length - 1)) * plotW; };
  const y = function(v) { return pad.top + ((max - v) / (max - min)) * plotH; };

  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', '0 0 ' + width + ' ' + height);
  svg.setAttribute('class', 'chart');
  svg.setAttribute('preserveAspectRatio', 'none');

  function add(tag, attrs, textValue) {
    const node = document.createElementNS(ns, tag);
    Object.keys(attrs || {}).forEach(function(k) { node.setAttribute(k, attrs[k]); });
    if (textValue != null) node.textContent = textValue;
    svg.appendChild(node);
    return node;
  }

  for (let i = 0; i <= 5; i++) {
    const value = min + (max - min) * i / 5;
    const yy = y(value);
    add('line', {
      x1: pad.left, x2: width - pad.right, y1: yy, y2: yy,
      stroke: '#252d35', 'stroke-width': 1
    });
    add('text', {
      x: pad.left - 8, y: yy + 4, 'text-anchor': 'end',
      fill: '#69747e', 'font-size': 10, 'font-family': '"IBM Plex Mono", monospace'
    }, (value >= 0 ? '+' : '') + value.toFixed(1) + '%');
  }

  const guideCount = Math.min(6, Math.max(2, dates.length));
  for (let i = 0; i < guideCount; i++) {
    const idx = Math.round(i * (dates.length - 1) / Math.max(1, guideCount - 1));
    const xx = x(idx);
    add('line', {
      x1: xx, x2: xx, y1: pad.top, y2: height - pad.bottom,
      stroke: '#1d252d', 'stroke-width': 1
    });
  }

  const defs = document.createElementNS(ns, 'defs');
  const gradient = document.createElementNS(ns, 'linearGradient');
  const gradientId = 'portfolio-fill-' + Math.random().toString(36).slice(2);
  gradient.setAttribute('id', gradientId);
  gradient.setAttribute('x1', '0'); gradient.setAttribute('x2', '0');
  gradient.setAttribute('y1', '0'); gradient.setAttribute('y2', '1');
  const stopTop = document.createElementNS(ns, 'stop');
  stopTop.setAttribute('offset', '0%');
  stopTop.setAttribute('stop-color', '#d4a24c');
  stopTop.setAttribute('stop-opacity', '0.20');
  const stopBottom = document.createElementNS(ns, 'stop');
  stopBottom.setAttribute('offset', '100%');
  stopBottom.setAttribute('stop-color', '#d4a24c');
  stopBottom.setAttribute('stop-opacity', '0');
  gradient.append(stopTop, stopBottom);
  defs.appendChild(gradient);
  svg.appendChild(defs);

  const portPoints = portfolio.map(function(v, i) {
    return v == null ? null : [x(i), y(v)];
  }).filter(Boolean);

  if (portPoints.length > 1) {
    const area = document.createElementNS(ns, 'path');
    let areaD = 'M ' + portPoints[0][0] + ' ' + (height - pad.bottom) + ' ';
    areaD += portPoints.map(function(p) { return 'L ' + p[0] + ' ' + p[1]; }).join(' ');
    areaD += ' L ' + portPoints[portPoints.length - 1][0] + ' ' + (height - pad.bottom) + ' Z';
    area.setAttribute('d', areaD);
    area.setAttribute('fill', 'url(#' + gradientId + ')');
    svg.appendChild(area);
  }

  function drawLine(values, color, widthPx) {
    const pts = values.map(function(v, i) {
      return v == null ? null : x(i) + ',' + y(v);
    }).filter(Boolean);
    if (pts.length < 2) return;
    const line = document.createElementNS(ns, 'polyline');
    line.setAttribute('points', pts.join(' '));
    line.setAttribute('fill', 'none');
    line.setAttribute('stroke', color);
    line.setAttribute('stroke-width', widthPx);
    line.setAttribute('stroke-linecap', 'round');
    line.setAttribute('stroke-linejoin', 'round');
    svg.appendChild(line);
  }

  drawLine(benchmark, '#68727d', 1.4);
  drawLine(portfolio, '#d4a24c', 2.2);

  const xGuideCount = Math.min(5, Math.max(2, dates.length));
  for (let i = 0; i < xGuideCount; i++) {
    const idx = Math.round(i * (dates.length - 1) / Math.max(1, xGuideCount - 1));
    add('text', {
      x: x(idx), y: height - 8, 'text-anchor': 'middle',
      fill: '#69747e', 'font-size': 10, 'font-family': '"IBM Plex Mono", monospace'
    }, fmtDate(dates[idx]));
  }

  const host = el('div');
  host.style.position = 'relative';
  host.appendChild(svg);

  const tooltip = el('div', { class: 'chart-tooltip' });
  host.appendChild(tooltip);

  const crosshair = add('line', {
    y1: pad.top, y2: height - pad.bottom,
    stroke: 'rgba(232,230,224,.18)', 'stroke-dasharray': '3 3'
  });
  crosshair.style.display = 'none';

  const dot = add('circle', { r: 4, fill: '#d4a24c' });
  dot.style.display = 'none';

  host.addEventListener('mousemove', function(event) {
    const rect = svg.getBoundingClientRect();
    const localX = Math.max(0, Math.min(rect.width, event.clientX - rect.left));
    const ratio = localX / rect.width;
    const idx = Math.max(0, Math.min(dates.length - 1, Math.round(ratio * (dates.length - 1))));
    if (portfolio[idx] == null) return;

    const px = x(idx);
    const py = y(portfolio[idx]);
    crosshair.setAttribute('x1', px);
    crosshair.setAttribute('x2', px);
    crosshair.style.display = 'block';
    dot.setAttribute('cx', px);
    dot.setAttribute('cy', py);
    dot.style.display = 'block';

    const bmValue = benchmark[idx] == null ? '—' :
      (benchmark[idx] >= 0 ? '+' : '') + benchmark[idx].toFixed(2) + '%';
    tooltip.innerHTML =
      '<div class="date">' + fmtDate(dates[idx]) + '</div>' +
      '<div class="row"><span class="portfolio">Portfolio</span><span class="portfolio">' +
      (portfolio[idx] >= 0 ? '+' : '') + portfolio[idx].toFixed(2) + '%</span></div>' +
      '<div class="row"><span class="benchmark">S&amp;P 500</span><span class="benchmark">' +
      bmValue + '</span></div>';

    tooltip.style.display = 'block';
    const hostRect = host.getBoundingClientRect();
    const scaledX = (px / width) * rect.width;
    const scaledY = (py / height) * rect.height;
    let tx = scaledX + 12;
    if (tx + 180 > hostRect.width) tx = scaledX - 192;
    tooltip.style.left = Math.max(6, tx) + 'px';
    tooltip.style.top = Math.max(8, scaledY - 54) + 'px';
  });

  host.addEventListener('mouseleave', function() {
    tooltip.style.display = 'none';
    crosshair.style.display = 'none';
    dot.style.display = 'none';
  });

  return host;
}
function renderPositions(d) {
  const p = d.portfolio || {};
  const positions = p.positions || [];
  const sec = el('section');
  sec.appendChild(el('h2', { text: 'Open positions' }));
  sec.appendChild(el('div', {
    class: 'sub',
    text: `${p.n_positions ?? 0} position${p.n_positions === 1 ? '' : 's'} · cash ${fmtUSD(p.cash)} · reserve ${fmtPct(d.strategy ? d.strategy.cash_reserve_pct ?? 0.10 : 0.10)} · stock cap ${fmtPct(d.strategy ? d.strategy.max_position_pct_equity ?? 0.25 : 0.25)} · sector cap ${fmtPct(d.strategy ? d.strategy.max_sector_pct_equity ?? 0.50 : 0.50)}`
  }));
  const drawdownPct = Number(p.current_drawdown_pct);
  const drawdownLabel = Number.isFinite(drawdownPct) ? `${(drawdownPct * 100).toFixed(1)}%` : '—';
  const drawdownTrigger = Number((d.strategy && d.strategy.max_portfolio_drawdown_pct) ?? 0.20);
  const drawdownResume = Number((d.strategy && d.strategy.drawdown_resume_below_pct) ?? 0.12);
  sec.appendChild(el('div', {
    class: 'sub',
    text: p.drawdown_paused
      ? `DRAWDOWN PROTECTION ACTIVE · ${drawdownLabel} drawdown · new buys paused`
      : `Portfolio drawdown ${drawdownLabel} · pause at ${(drawdownTrigger * 100).toFixed(0)}%, resume below ${(drawdownResume * 100).toFixed(0)}%`
  }));
  if (!positions.length) {
    sec.classList.add('empty');
    sec.appendChild(el('p', { text: 'No open positions in the ladder right now.' }));
  } else {
    const table = el('table');
    table.appendChild(el('thead', {}, el('tr', {}, [
      el('th', { text: 'ticker' }), el('th', { text: 'sector' }),
      el('th', { class: 'num', text: 'market value' }),
      el('th', { class: 'num', text: 'weight ×' }),
      el('th', { class: 'num', text: 'entry' }), el('th', { class: 'num', text: 'entry px' }),
      el('th', { class: 'num', text: 'last px' }), el('th', { class: 'num', text: 'unrealised' }),
      el('th', { class: 'num', text: 'held' }),
    ])));
    const tbody = el('tbody');
    positions.forEach(row => {
      const held = row.bars_held != null ? `${row.bars_held} sessions` : '—';
      const weight = row.allocation_weight == null || !Number.isFinite(Number(row.allocation_weight))
        ? '1.00×' : `${Number(row.allocation_weight).toFixed(2)}×`;
      tbody.appendChild(el('tr', {}, [
        el('td', {}, el('span', { class: 'ticker-badge', text: row.ticker })),
        el('td', { class: 'name-cell', text: row.sector || '—' }),
        el('td', { class: 'num', text: fmtUSD(row.last_value) }),
        el('td', { class: 'num', text: weight }),
        el('td', { class: 'num', text: fmtDate(row.entry_date) }),
        el('td', { class: 'num', text: fmtUSD(row.entry_price) }),
        el('td', { class: 'num', text: fmtUSD(row.last_price) }),
        el('td', { class: `num ${pctClass(row.unrealised_pct)}`, text: fmtPct(row.unrealised_pct) }),
        el('td', { class: 'num', text: held }),
      ]));
    });
    table.appendChild(tbody);
    sec.appendChild(el('div', { class: 'tbl-scroll' }, table));
  }
  const pending = p.pending_orders || [];
  if (pending.length) {
    const note = el('div', { class: 'sub', style: 'margin-top:1rem' });
    note.innerHTML = `Queued for next open: ` +
      pending.map(o => `<span class="ticker-badge">${o.ticker}</span> (${o.sector || 'sector n/a'})`).join(', ');
    sec.appendChild(note);
  }
  const adjustments = p.pending_rebalances || [];
  if (adjustments.length) {
    const note = el('div', { class: 'sub', style: 'margin-top:0.5rem' });
    note.textContent = 'Rank-weighted adjustments queued: ' + adjustments.map(o =>
      `${o.ticker}: ${o.action === 'increase' ? '+' : '−'}${fmtUSD(o.notional)}`
    ).join(' · ');
    sec.appendChild(note);
  }
  return sec;
}

function renderSectors(d) {
  const p = d.portfolio || {};
  const counts = p.sector_counts || {};
  const cap = d.strategy ? d.strategy.max_positions_per_sector : null;
  const sec = el('section');
  sec.appendChild(el('h2', { text: 'Sector exposure' }));
  const entries = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  if (!entries.length) {
    sec.classList.add('empty');
    sec.appendChild(el('p', { text: 'No positions to break down by sector yet.' }));
    return sec;
  }
  const maxScale = Math.max(cap || 1, ...entries.map(e => e[1]));
  entries.forEach(([name, count]) => {
    const row = el('div', { class: 'sector-row' });
    row.appendChild(el('div', { class: 'name', text: name }));
    const track = el('div', { class: 'sector-track' });
    track.appendChild(el('div', { class: 'sector-fill', style: `width:${(count / maxScale) * 100}%` }));
    if (cap) {
      track.appendChild(el('div', { class: 'sector-cap-mark', style: `left:${(cap / maxScale) * 100}%` }));
    }
    row.appendChild(track);
    row.appendChild(el('div', { class: 'count', text: cap ? `${count} / ${cap}` : String(count) }));
    sec.appendChild(row);
  });
  return sec;
}

function renderWeights(d) {
  const weights = d.factor_weights || {};
  const sec = el('section');
  sec.appendChild(el('h2', { text: 'Factor weights' }));
  sec.appendChild(el('div', {
    class: 'sub',
    text: d.learning && d.learning.enabled
      ? `Self-learning is ${d.learning.mode || 'on'}; these adjust monthly within bounds.`
      : 'Set by hand in config.yml.'
  }));
  Object.entries(weights).forEach(([name, w]) => {
    const row = el('div', { class: 'weight-row' });
    row.appendChild(el('div', { text: name }));
    const track = el('div', { class: 'weight-track' });
    track.appendChild(el('div', { class: 'weight-fill', style: `width:${Math.min(100, w * 100 * 2)}%` }));
    row.appendChild(track);
    row.appendChild(el('div', { class: 'pct', text: (w * 100).toFixed(0) + '%' }));
    sec.appendChild(row);
  });
  return sec;
}

function renderLifecycleEvaluation(d) {
  const report = d.lifecycle_evaluation || {};
  const counts = report.counts || {};
  const overall = report.overall || {};
  const split = report.temporal_validation || {};
  const train = split.training || {};
  const valid = split.validation || {};
  const sec = el('section');
  sec.appendChild(el('h2', { text: 'Signal outcome assessment' }));
  sec.appendChild(el('p', {
    class: 'sub',
    text: report.status_message || 'The first evaluation report will appear after the next daily run.'
  }));

  const stats = el('div', { class: 'stats' });
  const cells = [
    ['Closed trades', counts.closed_trades ?? 0],
    ['Linked signals', counts.linked_trades ?? 0],
    ['Usable outcomes', counts.evaluable_trades ?? 0],
    ['Win rate', fmtPct(overall.win_rate, 1)],
    ['Average return', fmtPct(overall.mean_return, 2)],
    ['Median return', fmtPct(overall.median_return, 2)],
  ];
  cells.forEach(([label, value]) => {
    const box = el('div', { class: 'stat' });
    box.append(el('div', { class: 'k', text: label }),
               el('div', { class: 'v', text: String(value) }));
    stats.appendChild(box);
  });
  sec.appendChild(stats);

  const splitText = 'Temporal split: training ' + (train.n ?? 0) +
    ' trades; validation ' + (valid.n ?? 0) +
    '; cutoff ' + fmtDate(split.cutoff_signal_date) + '. ' +
    (split.status === 'available_for_review'
      ? 'The split is large enough for review, not automatic weight changes.'
      : 'More linked completed trades are needed before temporal validation.');
  const splitLine = el('p', { class: 'sub', text: splitText });
  splitLine.style.marginTop = '0.8rem';
  sec.appendChild(splitLine);

  const factors = report.factor_associations || [];
  if (!factors.length) {
    sec.classList.add('empty');
    sec.appendChild(el('p', { text: 'Factor associations will be calculated when linked lifecycle outcomes are available.' }));
    return sec;
  }
  const table = el('table');
  table.appendChild(el('thead', {}, el('tr', {}, [
    el('th', { text: 'factor block' }),
    el('th', { class: 'num', text: 'n' }),
    el('th', { class: 'num', text: 'rho · all' }),
    el('th', { class: 'num', text: 'rho · train' }),
    el('th', { class: 'num', text: 'rho · validation' }),
    el('th', { class: 'num', text: 'mean return if factor > 0' }),
    el('th', { class: 'num', text: 'difference vs ≤ 0' }),
  ])));
  const tbody = el('tbody');
  factors.forEach(row => {
    tbody.appendChild(el('tr', {}, [
      el('td', { class: 'name-cell', text: row.block || '—' }),
      el('td', { class: 'num', text: String(row.n ?? 0) }),
      el('td', { class: 'num', text: fmtNum(row.spearman_return, 2) }),
      el('td', { class: 'num', text: fmtNum(row.training_spearman_return, 2) }),
      el('td', { class: 'num', text: fmtNum(row.validation_spearman_return, 2) }),
      el('td', { class: 'num ' + pctClass(row.mean_return_factor_positive), text: fmtPct(row.mean_return_factor_positive, 2) }),
      el('td', { class: 'num ' + pctClass(row.positive_minus_nonpositive_mean_return), text: fmtPct(row.positive_minus_nonpositive_mean_return, 2) }),
    ]));
  });
  table.appendChild(tbody);
  sec.appendChild(el('div', { class: 'tbl-scroll' }, table));
  sec.appendChild(el('p', {
    class: 'sub',
    text: 'Exploratory associations only; small samples can be noisy and correlation is not causation. Factor weights are not changed by this report.'
  }));
  return sec;
}

function renderTrades(d) {
  const rows = d.recent_trades || [];
  const sec = el('section');
  sec.appendChild(el('h2', { text: 'Recent closed trades' }));
  if (!rows.length) {
    sec.classList.add('empty');
    sec.appendChild(el('p', { text: 'No positions have closed yet.' }));
    return sec;
  }
  const table = el('table');
  table.appendChild(el('thead', {}, el('tr', {}, [
    el('th', { text: 'ticker' }), el('th', { text: 'sector' }),
    el('th', { text: 'entry' }), el('th', { text: 'exit' }),
    el('th', { class: 'num', text: 'return' }), el('th', { class: 'num', text: 'pnl' }),
  ])));
  const tbody = el('tbody');
  rows.forEach(row => {
    tbody.appendChild(el('tr', {}, [
      el('td', {}, el('span', { class: 'ticker-badge', text: row.ticker })),
      el('td', { class: 'name-cell', text: row.sector || '—' }),
      el('td', { text: fmtDate(row.entry_date) }),
      el('td', { text: fmtDate(row.exit_date) }),
      el('td', { class: `num ${pctClass(row.return_pct)}`, text: fmtPct(row.return_pct) }),
      el('td', { class: `num ${pctClass(row.pnl)}`, text: fmtUSD(row.pnl) }),
    ]));
  });
  table.appendChild(tbody);
  sec.appendChild(el('div', { class: 'tbl-scroll' }, table));
  return sec;
}

function renderLearning(d) {
  const rows = (d.learning && d.learning.recent_decisions) || [];
  const sec = el('section');
  sec.appendChild(el('h2', { text: 'Learning log' }));
  if (!rows.length) {
    sec.classList.add('empty');
    sec.appendChild(el('p', { text: 'Automatic tuning is paused while lifecycle outcomes and independent validation accumulate.' }));
    return sec;
  }
  const table = el('table');
  table.appendChild(el('thead', {}, el('tr', {}, [
    el('th', { text: 'date' }), el('th', { text: 'decision' }), el('th', { text: 'reason' }),
  ])));
  const tbody = el('tbody');
  rows.forEach(row => {
    tbody.appendChild(el('tr', {}, [
      el('td', { text: fmtDate(row.run_date) }),
      el('td', { class: 'name-cell', text: row.decision || '—' }),
      el('td', { class: 'name-cell', text: row.reason || '' }),
    ]));
  });
  table.appendChild(tbody);
  sec.appendChild(el('div', { class: 'tbl-scroll' }, table));
  return sec;
}

function renderFooter(d) {
  const meta = d.meta || {};
  return el('footer', {
    html: `Last run ${meta.run_time || '—'} on data through ${fmtDate(meta.data_date)}. ` +
          `Fundamentals as of ${fmtDate(meta.fundamentals_asof)}. ` +
          `Universe ${meta.universe_size ?? '—'} names, ${meta.eligible_count ?? '—'} eligible. ` +
          `Page generated ${d.generated_at || '—'}. ` +
          `<a href="https://github.com/Vitoldinijs/sp500-screener" target="_blank" rel="noopener">source on GitHub</a>.`
  });
}

async function main() {
  let d;
  try {
    const res = await fetch('data/dashboard.json', { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    d = await res.json();
  } catch (err) {
    $('#stateMsg').textContent = 'No data published yet — the first daily run will populate this page.';
    return;
  }

  $('#strategyLabel').textContent =
    `${(d.strategy && d.strategy.name) || 'strategy'} · signal-driven exits`;

  app.innerHTML = '';
  app.appendChild(renderHero(d));
  app.appendChild(renderStats(d));
  app.appendChild(renderEquitySection(d));
  app.appendChild(renderPositions(d));
  app.appendChild(renderSectors(d));
  app.appendChild(renderWeights(d));
  app.appendChild(renderTrades(d));
  app.appendChild(renderLifecycleEvaluation(d));
  app.appendChild(renderLearning(d));
  app.appendChild(renderFooter(d));
}

main();
</script>
</body>
</html>
