# ============================================================================
#  Monthly self-tuning of the factor weights.
#
#  Reconstructs what each factor block would have predicted historically,
#  measures its rank correlation with realised 21-day forward returns, and
#  nudges the weights toward whatever actually worked — within hard bounds,
#  by at most 0.05 per month, and only if an out-of-sample check agrees.
#  Otherwise it rolls back and logs why. See screener/learn.py.
#
#  This is the one job that edits config.yml, so the diff shows exactly what
#  the bot changed and you can revert any month you disagree with.
# ============================================================================
name: monthly-learning

on:
  schedule:
    # 1st of the month, 07:00 UTC — after the weekly job, before Monday's open.
    - cron: "0 7 1 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Evaluate and log, but do not change the weights"
        type: boolean
        default: false

concurrency:
  group: portfolio-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Re-run the test suite before touching anything
        # If the code is broken, the last thing we want is to also rewrite the
        # weights based on it.
        run: python tests/test_screener.py

      - name: Tune the factor weights
        env:
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
        run: |
          python -m screener monthly ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Export dashboard data
        # Weights may have just changed; keep the dashboard's chart in sync.
        run: python scripts/export_dashboard_data.py

      - name: Commit the decision
        run: |
          git config user.name  "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add -A state config.yml docs/data
          if git diff --staged --quiet; then
            echo "weights unchanged"
            exit 0
          fi
          git commit -m "monthly weight tuning $(date -u +%Y-%m)"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin ${{ github.ref_name }} && \
            git push origin HEAD:${{ github.ref_name }} && exit 0
            echo "push attempt $attempt failed; retrying"
            sleep 5
          done
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### Monthly learning — $(date -u +'%Y-%m')"
            echo ""
            if [ -f state/weights_history.csv ]; then
              echo '```'
              head -1 state/weights_history.csv
              tail -3 state/weights_history.csv
              echo '```'
            else
              echo "No tuning has happened yet — needs 40+ closed trades."
            fi
            echo ""
            echo "Current weights:"
            echo '```yaml'
            sed -n '/^factor_weights:/,/^$/p' config.yml
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
