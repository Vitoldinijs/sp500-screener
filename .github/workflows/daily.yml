# ============================================================================
#  Daily paper-trading run.
#
#  Order of operations matters: the job screens the S&P 500 after the US close,
#  executes yesterday's queued order at today's open, queues today's, rebuilds
#  Portfolio.xlsx and commits the new state back to the repo. State lives in
#  git, so every day the bot trades is a readable diff.
# ============================================================================
name: daily

on:
  schedule:
    # 22:15 UTC = 18:15 ET (EDT) / 17:15 ET (EST) — after the 16:00 ET close,
    # with a margin for the provider to settle the day's bars.
    # Cron here is ALWAYS UTC, so the local time shifts by an hour when the US
    # changes clocks. That is harmless: it stays comfortably after the close.
    - cron: "15 22 * * 1-5"
  workflow_dispatch:            # lets you trigger a run by hand from the UI
    inputs:
      offline:
        description: "Run without network (use cached prices)"
        type: boolean
        default: false

# Never let two runs mutate state at the same time — a second run starting
# before the first commits would fork the portfolio.
concurrency:
  group: portfolio-state
  cancel-in-progress: false

permissions:
  contents: write               # required to push the updated state back

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the daily job
        env:
          # Never hardcode this. Repo -> Settings -> Secrets and variables ->
          # Actions -> New repository secret, named ALPHAVANTAGE_KEY.
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
        run: |
          python -m screener daily ${{ inputs.offline && '--offline' || '' }}

      - name: Export dashboard data
        # Feeds docs/index.html (deployed separately on Cloudflare Pages,
        # which auto-redeploys whenever this commit lands on the repo).
        run: python scripts/export_dashboard_data.py

      - name: Commit updated portfolio state
        run: |
          git config user.name  "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add -A state Portfolio.xlsx config.yml docs/data
          if git diff --staged --quiet; then
            echo "nothing changed (market holiday?) — skipping commit"
            exit 0
          fi
          git commit -m "daily run $(date -u +%Y-%m-%d)"
          # Rebase in case the weekly/monthly job pushed while we were running.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin ${{ github.ref_name }} && \
            git push origin HEAD:${{ github.ref_name }} && exit 0
            echo "push attempt $attempt failed; retrying"
            sleep 5
          done
          echo "could not push after 3 attempts" >&2
          exit 1

      - name: Upload the workbook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-xlsx
          path: Portfolio.xlsx
          if-no-files-found: warn
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          {
            echo "### Daily run — $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo ""
            if [ -f state/run_log.csv ]; then
              echo '```'
              head -1 state/run_log.csv
              tail -1 state/run_log.csv
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
