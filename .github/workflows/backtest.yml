name: historical-backtest

# Two modes:
#
# * full          — every block including fundamentals. Honest but short:
#                   point-in-time ratios only start at the first committed
#                   weekly snapshot, so this can only cover a few months and
#                   proves nothing about edge yet.
# * price-macro   — momentum, risk, technical and macro only. These need no
#                   fundamentals, so this can replay years. Run as a variant
#                   sweep it is the only way right now to get a statistically
#                   meaningful read on concentration, the regime layer and
#                   the macro block.
# * factor-ic     — ONE leg, long history, and the question is not what the
#                   book returned but whether the ranking predicts anything.
#                   Portfolio P&L over a few years rests on a few dozen
#                   closed trades; the ranking is tested on every name on
#                   every session, which is hundreds of thousands of
#                   observations and the only sample big enough to separate
#                   a signal from one lucky theme. Sizing, exposure gating
#                   and the breaker do not touch ranks, so a sweep would add
#                   nothing here — six legs would measure the same thing.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        required: true
        type: choice
        default: "price-macro-sweep"
        options:
          - price-macro-sweep
          - factor-ic
          - full-single
      start_date:
        description: "Start YYYY-MM-DD. Blank: 2024-01-02 for the sweep, 2020-01-02 for factor-ic, first fundamental snapshot for full."
        required: false
        type: string
        default: ""
      end_date:
        description: "End YYYY-MM-DD; blank uses the latest completed session"
        required: false
        type: string
        default: ""
      fundamentals:
        description: >-
          none = price/macro blocks only (as before). edgar = rebuild
          point-in-time fundamentals from SEC filings first and use them for
          the whole window (needs the SEC_USER_AGENT secret; adds ~15 min).
        required: false
        type: choice
        default: "none"
        options:
          - none
          - edgar

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # Download the decade of prices ONCE. Six legs pulling the same history
  # in parallel is both wasteful and a good way to get rate-limited by
  # Yahoo, which would fail every leg identically.
  # ---------------------------------------------------------------------
  prefetch:
    if: inputs.mode == 'price-macro-sweep' || inputs.mode == 'factor-ic'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Restore any existing price cache
        uses: actions/cache/restore@v4
        with:
          path: |
            state/cache/prices.csv.gz
            state/macro.csv
            screener/data/sp500.csv
            state/cache/fundamentals_edgar.csv.gz
          # Restore from any recent entry to avoid re-downloading, but SAVE
          # under a run-unique key below.
          key: backtest-data-${{ github.run_id }}
          restore-keys: |
            backtest-data-
      - name: Download price and macro history
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BACKTEST_START: ${{ inputs.start_date }}
          BACKTEST_END: ${{ inputs.end_date }}
          MODE: ${{ inputs.mode }}
        run: |
          # Each mode has its own default window, and the prefetch must match
          # the leg that will consume the cache: a shorter download would
          # leave the replay silently short of history at its start.
          if [[ "$MODE" == 'factor-ic' ]]; then default_start=2020-01-02
          else default_start=2024-01-02; fi
          args=(--start "${BACKTEST_START:-$default_start}")
          if [[ -n "$BACKTEST_END" ]]; then args+=(--end "$BACKTEST_END"); fi
          python scripts/prefetch_prices.py "${args[@]}"
      - name: Rebuild point-in-time fundamentals from SEC filings
        if: inputs.fundamentals == 'edgar'
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          BACKTEST_START: ${{ inputs.start_date }}
          BACKTEST_END: ${{ inputs.end_date }}
          MODE: ${{ inputs.mode }}
        run: |
          if [[ "$MODE" == 'factor-ic' ]]; then default_start=2020-01-02
          else default_start=2024-01-02; fi
          args=(--start "${BACKTEST_START:-$default_start}")
          if [[ -n "$BACKTEST_END" ]]; then args+=(--end "$BACKTEST_END"); fi
          # Fails, and writes nothing, if the quality report finds the
          # result grossly wrong — a split error above all.
          python scripts/build_edgar_fundamentals.py "${args[@]}"

      - name: Save the shared cache
        # The key MUST be unique per run. GitHub cache keys are immutable:
        # a save to an existing key is silently skipped. That is what went
        # wrong last run — the key already held a prices-only entry from
        # when FRED was failing, so the freshly downloaded macro series and
        # refreshed constituent list were never stored, and every leg
        # restored the stale entry instead.
        uses: actions/cache/save@v4
        with:
          path: |
            state/cache/prices.csv.gz
            state/macro.csv
            screener/data/sp500.csv
            state/cache/fundamentals_edgar.csv.gz
          key: backtest-data-${{ github.run_id }}

  # ---------------------------------------------------------------------
  # Variant sweep. Each leg changes exactly ONE thing against the baseline,
  # so a difference in the result can be attributed to that thing.
  # ---------------------------------------------------------------------
  sweep:
    if: inputs.mode == 'price-macro-sweep'
    needs: prefetch
    runs-on: ubuntu-latest
    # A hosted runner is roughly half the speed this was profiled at, and
    # the first attempt died at the 2h default partway through a 2016 start.
    timeout-minutes: 330
    strategy:
      fail-fast: false
      # All six legs read the same prefetched cache and make no network
      # calls, so there is nothing left to rate-limit and they can run at
      # once. Wall clock becomes one leg instead of three sequential pairs.
      max-parallel: 6
      matrix:
        include:
          - name: baseline-cap25
            args: ""
          - name: concentration-cap50
            args: "--set strategy.max_position_pct_equity=0.50 --set strategy.target_position_pct_equity=0.40"
          - name: concentration-cap15
            args: "--set strategy.max_position_pct_equity=0.15 --set strategy.target_position_pct_equity=0.12"
          - name: concentration-cap08
            args: "--set strategy.max_position_pct_equity=0.08 --set strategy.target_position_pct_equity=0.06"
          - name: regime-off
            args: "--set regime.enabled=false"
          - name: macro-off
            args: "--set factor_weights.macro=0.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore the shared price and macro cache
        # Populated once by the prefetch job above. The macro file matters as
        # much as the prices: a replay runs without network, so the regime
        # layer and the macro block read it and nothing else.
        uses: actions/cache/restore@v4
        with:
          path: |
            state/cache/prices.csv.gz
            state/macro.csv
            screener/data/sp500.csv
            state/cache/fundamentals_edgar.csv.gz
          # This run's entry, written by prefetch. No restore-keys
          # fallback: silently running on another run's data is exactly the
          # failure being fixed here.
          key: backtest-data-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Run ${{ matrix.name }}
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BACKTEST_START: ${{ inputs.start_date }}
          BACKTEST_END: ${{ inputs.end_date }}
        run: |
          # --offline: the prefetch job already downloaded this exact window
          # into the restored cache. Without it every leg re-downloads ~1.5M
          # rows it already has, which was most of the previous run's wall
          # clock and the reason the legs had to be throttled.
          args=(--offline --require-inclusion-dates
                --output-dir "backtest-results/${{ matrix.name }}" --verbose)
          if [[ "${{ inputs.fundamentals }}" == 'edgar' ]]; then
            args+=(--fundamentals-file state/cache/fundamentals_edgar.csv.gz)
          else
            args+=(--no-fundamentals)
          fi
          args+=(--start "${BACKTEST_START:-2024-01-02}")
          if [[ -n "$BACKTEST_END" ]]; then args+=(--end "$BACKTEST_END"); fi
          # shellcheck disable=SC2206
          extra=(${{ matrix.args }})
          python scripts/backtest.py "${args[@]}" "${extra[@]}"

      - name: Summarise ${{ matrix.name }}
        if: always() && hashFiles(format('backtest-results/{0}/summary.json', matrix.name)) != ''
        run: |
          {
            echo "### ${{ matrix.name }}"
            echo ''
            echo '```json'
            cat "backtest-results/${{ matrix.name }}/summary.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ${{ matrix.name }}
        if: always() && hashFiles(format('backtest-results/{0}/summary.json', matrix.name)) != ''
        uses: actions/upload-artifact@v4
        with:
          name: backtest-${{ matrix.name }}-${{ github.run_number }}
          path: backtest-results/${{ matrix.name }}/
          retention-days: 30

  # ---------------------------------------------------------------------
  # Does the ranking predict returns? One leg, long history, and the answer
  # comes from the exported panel rather than from the equity curve.
  # ---------------------------------------------------------------------
  factor-ic:
    if: inputs.mode == 'factor-ic'
    needs: prefetch
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore the shared price and macro cache
        uses: actions/cache/restore@v4
        with:
          path: |
            state/cache/prices.csv.gz
            state/macro.csv
            screener/data/sp500.csv
            state/cache/fundamentals_edgar.csv.gz
          key: backtest-data-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Replay and export the factor panel
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BACKTEST_START: ${{ inputs.start_date }}
          BACKTEST_END: ${{ inputs.end_date }}
        run: |
          args=(--offline --require-inclusion-dates
                --output-dir backtest-results/factor-ic --verbose)
          if [[ "${{ inputs.fundamentals }}" == 'edgar' ]]; then
            args+=(--fundamentals-file state/cache/fundamentals_edgar.csv.gz)
          else
            args+=(--no-fundamentals)
          fi
          args+=(--start "${BACKTEST_START:-2020-01-02}")
          if [[ -n "$BACKTEST_END" ]]; then args+=(--end "$BACKTEST_END"); fi
          python scripts/backtest.py "${args[@]}"

      - name: Measure information content
        if: always() && hashFiles('backtest-results/factor-ic/factor_panel.csv.gz') != ''
        run: |
          panel=backtest-results/factor-ic/factor_panel.csv.gz
          # tee, not plain redirection: the step summary renders nicely but
          # is not retrievable through the REST API, and the artifact holding
          # the panel is served from blob storage this environment cannot
          # reach. A report that exists only where it cannot be read is no
          # report, so it goes to the job log as well.
          {
            echo '## Does the ranking predict returns?'
            echo ''
            echo '### Horizon 21 sessions (the holding period the strategy targets)'
            echo '```'
            python scripts/factor_ic.py "$panel" --horizon 21 --by-year
            echo '```'
            echo ''
            echo '### Horizon 63 sessions (has the signal decayed by a quarter?)'
            echo '```'
            python scripts/factor_ic.py "$panel" --horizon 63
            echo '```'
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Summarise the replay itself
        if: always() && hashFiles('backtest-results/factor-ic/summary.json') != ''
        run: |
          {
            echo '### Replay summary (context only — the IC above is the result)'
            echo ''
            echo '```json'
            cat backtest-results/factor-ic/summary.json
            echo '```'
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload panel and report
        if: always() && hashFiles('backtest-results/factor-ic/summary.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: factor-ic-${{ github.run_number }}
          path: backtest-results/factor-ic/
          retention-days: 30

  compare:
    if: always() && inputs.mode == 'price-macro-sweep' && needs.sweep.result != 'skipped'
    needs: sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pandas
      - uses: actions/download-artifact@v4
        with:
          path: all-results
          pattern: backtest-*
      - name: Build comparison table
        run: python scripts/compare_backtests.py all-results >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------
  full:
    if: inputs.mode == 'full-single'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run full backtest
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BACKTEST_START: ${{ inputs.start_date }}
          BACKTEST_END: ${{ inputs.end_date }}
        run: |
          args=(--output-dir backtest-results/full --verbose)
          if [[ -n "$BACKTEST_START" ]]; then args+=(--start "$BACKTEST_START"); fi
          if [[ -n "$BACKTEST_END" ]]; then args+=(--end "$BACKTEST_END"); fi
          python scripts/backtest.py "${args[@]}"
      - name: Summarise
        if: always() && hashFiles('backtest-results/full/summary.json') != ''
        run: |
          {
            echo '### Full backtest (short history — machinery check, not evidence)'
            echo ''
            echo '```json'
            cat backtest-results/full/summary.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report
        if: always() && hashFiles('backtest-results/full/summary.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: backtest-full-${{ github.run_number }}
          path: backtest-results/full/
          retention-days: 30
