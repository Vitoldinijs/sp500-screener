name: historical-backtest

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Start date YYYY-MM-DD; blank uses the first point-in-time fundamental snapshot"
        required: false
        type: string
        default: ""
      end_date:
        description: "End date YYYY-MM-DD; blank uses the latest completed US market session"
        required: false
        type: string
        default: ""
      offline:
        description: "Use only a local price cache (usually leave disabled)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run historical backtest
        env:
          BACKTEST_START: ${{ inputs.start_date }}
          BACKTEST_END: ${{ inputs.end_date }}
          BACKTEST_OFFLINE: ${{ inputs.offline }}
        run: |
          args=(--output-dir backtest-results/latest --verbose)
          if [[ -n "$BACKTEST_START" ]]; then
            args+=(--start "$BACKTEST_START")
          fi
          if [[ -n "$BACKTEST_END" ]]; then
            args+=(--end "$BACKTEST_END")
          fi
          if [[ "$BACKTEST_OFFLINE" == "true" ]]; then
            args+=(--offline)
          fi
          python scripts/backtest.py "${args[@]}"

      - name: Add summary to Actions
        if: always() && hashFiles('backtest-results/latest/summary.json') != ''
        run: |
          echo '### Historical backtest results' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'See the JSON/CSV artifacts for the full report.' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat backtest-results/latest/summary.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always() && hashFiles('backtest-results/latest/summary.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: historical-backtest-${{ github.run_number }}
          path: |
            backtest-results/latest/summary.json
            backtest-results/latest/equity_curve.csv
            backtest-results/latest/trades.csv
          if-no-files-found: warn
          retention-days: 30
